<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:;">
<title>生长之树</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/plugins.css">
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <svg id="tree" viewBox="0 0 460 800" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>

    <div class="trunk-hit ui-hit" id="trunkHit"></div>

    <div class="topbar ui-hit" id="topbar">
      <span class="grip" title="按住这里移动窗口">⣿</span>
      <button class="chip" id="btnPanel" title="插件面板 (Ctrl+Alt+P)">插 件</button>
      <div class="modes" id="modes">
        <button class="mode on" data-mode="water" title="浇水：点树根加生长值">浇水</button>
        <button class="mode" data-mode="prune" title="修剪：点亮的枝条剪掉，+养分">修剪</button>
        <button class="mode" data-mode="harvest" title="收获：点枝头的花果收取">收获</button>
        <button class="mode" data-mode="poke" title="点击：手伸过去摸一下树">点击</button>
      </div>
      <button class="chip on" id="btnTop" title="点一下切换：置顶 / 不挡住其他软件">置 顶</button>
      <button class="chip" id="btnThrough" title="鼠标穿透，点不到任何东西 (Ctrl+Alt+L 恢复)">穿 透</button>
      <button class="chip icon" id="btnHide" title="隐藏到托盘 (Ctrl+Alt+T)">–</button>
    </div>

    <div class="floats" id="floats"></div>
    <div class="fx" id="fx"></div>

    <div class="base ui-hit" id="base">
      <div class="slots" id="slots"></div>
      <div class="levelbar">
        <div class="lv">LV <b id="lvNum">1</b><span class="stagetag" id="stageName">种子</span></div>
        <div class="bar"><i id="xpFill"></i></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>

    <button class="fab ui-hit" id="fabHarvest">收全部<b>0</b></button>

    <div class="zoomer ui-hit" id="zoomer">
      <button id="zoomOut" title="缩小 (Ctrl+滚轮)">−</button>
      <span id="zoomVal">100%</span>
      <button id="zoomIn" title="放大 (Ctrl+滚轮)">+</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="ask ui-hit" id="ask">
      <div class="ask-card">
        <h4 id="askTitle">确认</h4>
        <p id="askText"></p>
        <div class="ask-btns">
          <button class="btn ghost" id="askCancel">取消</button>
          <button class="btn danger" id="askOk">确定</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="panel ui-hit" id="panel">
    <header class="panel-head ui-hit">
      <div class="tabs" id="tabs"></div>
      <button class="tab gear" id="tabGear" title="插件管理">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 7h9M17.5 7H20M4 12h4M11 12h9M4 17h9M17.5 17H20"/>
          <circle cx="15.2" cy="7" r="1.9"/><circle cx="9" cy="12" r="1.9"/><circle cx="15.2" cy="17" r="1.9"/>
        </svg>
      </button>
      <button class="chip icon" id="btnClosePanel" title="收起面板">✕</button>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <!-- 拖边缩放：贴着窗口四边/四角，鼠标移到边缘才亮 -->
  <div class="rz n ui-hit" data-edge="n"></div>
  <div class="rz s ui-hit" data-edge="s"></div>
  <div class="rz w ui-hit" data-edge="w"></div>
  <div class="rz e ui-hit" data-edge="e"></div>
  <div class="rz nw ui-hit" data-edge="nw"></div>
  <div class="rz ne ui-hit" data-edge="ne"></div>
  <div class="rz sw ui-hit" data-edge="sw"></div>
  <div class="rz se ui-hit" data-edge="se"></div>
</div>

<script src="js/bus.js"></script>
<script src="js/tree.js"></script>
<script src="js/codex-data.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/host.js"></script>
<script src="js/app.js"></script>
</body>
</html>
