<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';">
<title>sun</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: drag;
    cursor: grab;
    user-select: none;
  }
  body:active { cursor: grabbing; }

  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* 光晕画在窗口内部、到边缘刚好淡到 0 —— 不能用 box-shadow，
     它会被窗口边界硬切，看起来就是一个方块边框 */
  .glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    /* 只在球体外面加一圈光晕：中间留空，否则会把球的层次压平 */
    background: radial-gradient(
      circle closest-side,
      rgba(255, 212, 140, 0) 0%,
      rgba(255, 212, 140, 0) 60%,
      rgba(255, 201, 118, 0.22) 71%,
      rgba(255, 176, 96, 0.1) 82%,
      rgba(186, 138, 255, 0.06) 91%,
      rgba(186, 138, 255, 0) 100%
    );
    animation: pulse 6.5s ease-in-out infinite alternate;
  }
  .orb {
    position: relative;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 50% 44%,
      #fffef6 0%,
      #fff6cf 18%,
      #ffe1a0 40%,
      #ffc163 64%,
      rgba(255, 160, 56, 0.9) 84%,
      rgba(255, 146, 44, 0) 98%
    );
  }
  .rays {
    position: absolute;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255, 232, 178, 0.32) 0deg 2.2deg,
      rgba(255, 232, 178, 0) 2.2deg 21deg
    );
    -webkit-mask: radial-gradient(circle, transparent 66%, #000 74%, transparent 97%);
    mask: radial-gradient(circle, transparent 66%, #000 74%, transparent 97%);
    animation: spin 48s linear infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    from { opacity: 0.88; transform: scale(0.985); }
    to { opacity: 1; transform: scale(1.015); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="rays"></div>
    <div class="orb"></div>
  </div>
</body>
</html>
